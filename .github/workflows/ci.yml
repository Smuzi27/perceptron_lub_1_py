name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить uv и Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict src tests perceptron.py

      - name: pytest
        run: uv run pytest
